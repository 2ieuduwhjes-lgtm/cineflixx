<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Config kontrol</title>
<style>body{background:#141414;color:#fff;font-family:sans-serif;padding:20px;line-height:1.6}.ok{color:#2ecc71}.bad{color:#ff4757}h2{color:#e50914}p{margin:6px 0}</style></head>
<body><h2>firebase-config.js kontrolü</h2><div id="out"></div>
<script>
const out=document.getElementById('out');
const log=(t,c)=>{out.innerHTML+='<p class="'+(c||'')+'">'+t+'</p>';};
window.addEventListener('error',e=>{
  if(e.filename&&e.filename.indexOf('firebase-config')>-1)
    log('❌ Dosyada yazım hatası: '+e.message+' (satır '+e.lineno+', sütun '+e.colno+')','bad');
});
document.write('<script src="firebase-config.js?t='+Date.now()+'"><\/script>');
</script>
<script>
setTimeout(()=>{
  const c=window.CINEFLIX_CONFIG;
  if(!c){log('❌ CINEFLIX_CONFIG tanımlanmamış. Dosya bulunamadı (404) ya da yukarıda bir yazım hatası var.','bad');return;}
  log('✅ Dosya okundu','ok');
  const top=['firebase','tmdbKey','adminPassword','contactEmail','sandbox'];
  Object.keys(c).filter(k=>top.indexOf(k)<0).forEach(k=>log('⚠️ Tanınmayan anahtar: "'+k+'" (büyük/küçük harf hatası olabilir)','bad'));
  const f=c.firebase;
  if(!f){log('❌ "firebase: { ... }" bloğu yok','bad');return;}
  const keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
  keys.forEach(k=>{const v=f[k];const good=v&&!/BURAYA|PROJE_ID/.test(v);log((good?'✅ ':'❌ ')+k+(good?'':' eksik, boş veya örnek değer'),good?'ok':'bad');});
  Object.keys(f).filter(k=>keys.indexOf(k)<0&&k!=='measurementId').forEach(k=>log('⚠️ Tanınmayan alan: "'+k+'" (büyük/küçük harf hatası olabilir)','bad'));
},400);
</script></body></html>
